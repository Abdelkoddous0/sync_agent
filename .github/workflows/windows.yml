name: Windows distribution
on: [workflow_dispatch]
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse PowerShell without running installers
        shell: powershell
        run: |
          foreach ($file in @('ensure_aws_cli.ps1', 'install.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
      - name: Offline unit tests and compile
        shell: cmd
        run: |
          python -m pip install -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          python -m pytest tests -q
          if errorlevel 1 exit /b 1
          python -m compileall -q -x "(\.venv|build|dist)" .
          if errorlevel 1 exit /b 1
      - name: Build only unified application
        shell: cmd
        run: build.bat
      - name: Verify packaged executable (no setup or cloud)
        shell: powershell
        run: |
          & .\dist\SyncAgent\SyncAgent.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable smoke test failed' }
          foreach ($file in @('install.ps1', 'uninstall.ps1', 'ensure_aws_cli.ps1')) {
            if (!(Test-Path (Join-Path 'dist\SyncAgent' $file))) { throw "Missing $file" }
          }
      - name: Native packaged install, upgrade, uninstall and junction acceptance
        shell: powershell
        run: |
          # Disposable runner only: tests refuse an existing SyncAgent Run entry.
          $env:SYNC_AGENT_TEST_BUNDLE = Join-Path $pwd 'dist\SyncAgent'
          python -m pytest tests/test_native_bundle.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Native packaged acceptance failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SyncAgent-windows
          path: dist/SyncAgent/
